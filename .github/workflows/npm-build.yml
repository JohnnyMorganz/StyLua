name: NPM Packaging
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  # Ensure it builds on all platforms
  smoketest:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform-dir: linux-x64
            gh-artifact: stylua-linux-x86_64
          - os: macos-latest
            platform-dir: darwin-arm64
            gh-artifact: stylua-macos-aarch64
          - os: windows-latest
            platform-dir: win32-x64
            gh-artifact: stylua-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Get release version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./stylua-npm-bin/package.json').version")" >> $GITHUB_OUTPUT

      - name: Download and extract release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL \
            "https://github.com/johnnymorganz/stylua/releases/download/${{ steps.version.outputs.tag }}/${{ matrix.gh-artifact }}.zip" \
            -o release.zip
          unzip release.zip -d "stylua-npm-bin/platforms/${{ matrix.platform-dir }}/"
          rm release.zip

      - name: Download and extract release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://github.com/johnnymorganz/stylua/releases/download/${{ steps.version.outputs.tag }}/${{ matrix.gh-artifact }}.zip" `
            -OutFile release.zip
          Expand-Archive release.zip -DestinationPath "stylua-npm-bin/platforms/${{ matrix.platform-dir }}/"
          Remove-Item release.zip

      - name: Pack platform and main packages
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/stylua-npm-bin/platforms/${{ matrix.platform-dir }}"
          npm pack
          echo "PLATFORM_TGZ=$(pwd)/$(ls *.tgz)" >> $GITHUB_ENV

          cd "$GITHUB_WORKSPACE/stylua-npm-bin"
          npm pack
          echo "MAIN_TGZ=$(pwd)/$(ls *.tgz)" >> $GITHUB_ENV

      - name: Install in fresh test project
        # Mirrors a real user install: both packages land as siblings in node_modules/,
        # with run.js at node_modules/@johnnymorganz/stylua-bin/run.js resolving the
        # platform binary from the adjacent node_modules/@johnnymorganz/stylua-bin-*/
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-install"
          cd "$GITHUB_WORKSPACE/test-install"
          npm install --no-save "$PLATFORM_TGZ"
          npm install --no-save --no-optional "$MAIN_TGZ"

      - name: Test via bin
        shell: bash
        working-directory: ${{ github.workspace }}/test-install
        run: ./node_modules/.bin/stylua --version
